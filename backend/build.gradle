plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.moviebot'
version = '0.0.1-SNAPSHOT'
description = 'AI-powered movie recommendation chatbot using Spring Boot, GPT, and TMDB API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA(Hibernate) 사용
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-web' // Spring MVC / REST API

    compileOnly 'org.projectlombok:lombok'         // Lombok (컴파일 시만 사용)
    developmentOnly 'org.springframework.boot:spring-boot-devtools' // 개발 편의 기능
    runtimeOnly 'org.postgresql:postgresql'        // PostgreSQL JDBC 드라이버 (실행 시 필요)

    annotationProcessor 'org.projectlombok:lombok' // Lombok 애노테이션 처리기

    testImplementation 'org.springframework.boot:spring-boot-starter-test' // 테스트 라이브러리
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // JUnit 실행 환경

    implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security


    implementation 'org.springframework.boot:spring-boot-starter-validation' // Validation (@NotBlank, @Email, @Valid 등)

}

tasks.named('test') {
	useJUnitPlatform()
}
